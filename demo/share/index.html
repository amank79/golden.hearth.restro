<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurant POS Demo</title>
<style>
  :root {
    --bg: #F3F1EE;
    --panel: #FFFFFF;
    --ink: #2A1E17;
    --muted: #6B5E55;
    --line: #E4DDD6;
    --soft: #F7F3EF;
    --accent: #D9822B;
    --accent-dark: #B8691A;
    --dark: #2A1E17;
    --green: #2E7D4F;
    --green-soft: #E6F2EA;
    --red: #B3261E;
    --amber: #B7790E;
    --amber-soft: #FBF1DC;
    --blue: #2F5D8A;
    --blue-soft: #E5EDF5;
    --radius: 12px;
    --font: "Segoe UI", system-ui, -apple-system, Roboto, "Noto Sans", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; }
  button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  input { font-family: inherit; font-size: 15px; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .app { display: grid; grid-template-columns: 220px 1fr; height: 100vh; }

  /* Sidebar */
  .sidebar { background: var(--dark); color: #EFE7DF; display: flex; flex-direction: column; padding: 18px 12px; gap: 4px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
  .brand-logo { width: 38px; height: 38px; border-radius: 10px; background: var(--accent); color: var(--dark); display: grid; place-items: center; font-weight: 800; font-size: 18px; }
  .brand b { display: block; font-size: 15px; }
  .brand small { color: #BFB2A6; font-size: 12px; }
  .nav-btn { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; color: #DCD1C6; font-weight: 600; text-align: left; }
  .nav-btn:hover { background: #3A2C23; }
  .nav-btn.active { background: var(--accent); color: var(--dark); }
  .nav-btn .count { margin-left: auto; background: #FFFFFF22; border-radius: 99px; padding: 1px 8px; font-size: 12px; }
  .nav-btn.active .count { background: #2A1E1722; }
  .side-foot { margin-top: auto; padding: 12px; border-top: 1px solid #FFFFFF1A; font-size: 13px; color: #BFB2A6; line-height: 1.5; }
  .side-foot b { color: #EFE7DF; }

  /* Main */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .demo-strip { background: var(--amber-soft); color: #6A4A0C; font-size: 13.5px; padding: 8px 20px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #EAD9B5; }
  .demo-strip button { margin-left: auto; font-weight: 700; color: #6A4A0C; padding: 0 6px; }
  .topbar { display: flex; align-items: center; gap: 14px; padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .topbar h1 { font-size: 21px; margin: 0; }
  .topbar p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
  .topbar .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 99px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .pill.ok { background: var(--green-soft); color: var(--green); }
  .pill.ok::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .clock { font-weight: 700; font-variant-numeric: tabular-nums; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--soft); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .view { flex: 1; overflow: auto; padding: 20px 24px; min-height: 0; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 10px; font-weight: 700; background: var(--soft); border: 1px solid var(--line); }
  .btn:hover { filter: brightness(0.97); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
  .btn.dark { background: var(--dark); border-color: var(--dark); color: #FFFFFF; }
  .btn.green { background: var(--green); border-color: var(--green); color: #FFFFFF; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }

  /* Veg / non-veg mark */
  .vmark { width: 14px; height: 14px; border: 1.6px solid var(--green); border-radius: 3px; display: inline-grid; place-items: center; flex: none; }
  .vmark::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .vmark.nv { border-color: var(--red); }
  .vmark.nv::after { background: var(--red); }

  /* Tables view */
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .legend { display: flex; gap: 16px; color: var(--muted); font-size: 13.5px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .stat-chips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat-chip { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; min-width: 130px; }
  .stat-chip b { font-size: 22px; display: block; }
  .stat-chip span { color: var(--muted); font-size: 13px; }
  .tables-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; margin-top: 14px; }
  .table-card { text-align: left; padding: 14px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--panel); min-height: 128px; display: flex; flex-direction: column; gap: 4px; }
  .table-card:hover { transform: translateY(-1px); box-shadow: 0 4px 14px #2A1E1714; }
  .table-card .tno { font-size: 20px; font-weight: 800; }
  .table-card .seats { color: var(--muted); font-size: 12.5px; }
  .table-card .amt { margin-top: auto; font-weight: 800; font-size: 17px; }
  .table-card .state { font-size: 12.5px; font-weight: 700; }
  .table-card.free { border-color: #CFE3D6; }
  .table-card.free .state { color: var(--green); }
  .table-card.running { border-color: var(--accent); background: #FDF5EC; }
  .table-card.running .state { color: var(--accent-dark); }
  .table-card.billed { border-color: var(--blue); background: var(--blue-soft); }
  .table-card.billed .state { color: var(--blue); }
  .section-title { font-size: 15px; font-weight: 800; margin: 22px 0 4px; }
  .quick-orders { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }

  /* POS */
  .pos { display: grid; grid-template-columns: 170px minmax(0, 1fr) 390px; gap: 16px; height: 100%; min-height: 0; }
  .pos > * { min-width: 0; }
  .pos-view { padding: 16px 20px; overflow: hidden; }
  .cats { display: flex; flex-direction: column; gap: 6px; overflow: auto; }
  .cat-btn { text-align: left; padding: 11px 12px; border-radius: 10px; font-weight: 600; background: var(--panel); border: 1px solid var(--line); white-space: nowrap; }
  .cat-btn.active { background: var(--dark); color: #FFFFFF; border-color: var(--dark); }
  .items-col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; }
  .search input { border: 0; outline: 0; padding: 11px 0; flex: 1; background: transparent; }
  .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; overflow: auto; align-content: start; padding-bottom: 8px; }
  .item-btn { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: left; display: flex; flex-direction: column; gap: 6px; min-height: 124px; position: relative; }
  .item-btn:hover { border-color: var(--accent); }
  .item-btn .nm { font-weight: 700; line-height: 1.25; }
  .item-btn .pr { margin-top: auto; font-weight: 800; color: var(--accent-dark); }
  .item-btn .var { font-size: 12px; color: var(--muted); font-weight: 600; }
  .item-btn .qbadge { position: absolute; top: 8px; right: 8px; background: var(--accent); color: #FFFFFF; border-radius: 99px; font-size: 12px; font-weight: 800; min-width: 22px; height: 22px; display: grid; place-items: center; padding: 0 6px; }
  .item-btn.na { opacity: .5; cursor: not-allowed; }
  .item-btn.na .pr { color: var(--red); font-size: 13px; }

  .order { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .order-head { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .order-head .t { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .order-head .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .seg { display: flex; background: var(--soft); border-radius: 10px; padding: 3px; margin-top: 10px; }
  .seg button { flex: 1; padding: 7px; border-radius: 8px; font-weight: 600; font-size: 13.5px; color: var(--muted); }
  .seg button.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px #2A1E1726; }
  .order-lines { flex: 1; overflow: auto; padding: 6px 16px; }
  .ol { display: grid; grid-template-columns: 1fr auto 72px; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .ol .n { font-weight: 600; line-height: 1.25; }
  .ol .n small { display: block; color: var(--muted); font-weight: 500; font-size: 12.5px; }
  .ol .new { color: var(--accent-dark); font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; }
  .ol .lt { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .qty { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .qty button { width: 30px; height: 30px; font-weight: 800; font-size: 17px; background: var(--soft); }
  .qty span { width: 30px; text-align: center; font-weight: 700; }
  .cust { display: grid; gap: 8px; padding: 10px 0; }
  .cust input { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .empty { color: var(--muted); text-align: center; padding: 36px 16px; line-height: 1.6; }
  .totals { padding: 12px 16px; border-top: 1px solid var(--line); background: var(--soft); font-variant-numeric: tabular-nums; }
  .totals div { display: flex; justify-content: space-between; padding: 2px 0; color: var(--muted); font-size: 14px; }
  .totals .grand { color: var(--ink); font-size: 20px; font-weight: 800; padding-top: 6px; }
  .totals .disc-btn { color: var(--accent-dark); font-weight: 700; font-size: 13px; }
  .order-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px 16px; }
  .order-actions .full { grid-column: 1 / -1; }
  .pay-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; grid-column: 1 / -1; }
  .pay-row .btn { padding: 11px 6px; }
  .mobile-order-bar { display: none; }

  /* Kitchen */
  .kds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }
  .kds-col h3 { margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .kds-col h3 .cnt { background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 0 9px; font-size: 13px; }
  .kds-stack { display: flex; flex-direction: column; gap: 12px; }
  .ticket { background: var(--panel); border-radius: 12px; border: 1px solid var(--line); overflow: hidden; }
  .ticket-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; font-weight: 800; color: #FFFFFF; }
  .ticket.new .ticket-head { background: var(--red); }
  .ticket.preparing .ticket-head { background: var(--amber); }
  .ticket.ready .ticket-head { background: var(--green); }
  .ticket-head small { font-weight: 600; opacity: .92; }
  .ticket ul { list-style: none; margin: 0; padding: 8px 14px; }
  .ticket li { padding: 6px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 10px; font-weight: 600; }
  .ticket li:last-child { border-bottom: 0; }
  .ticket li b { min-width: 30px; }
  .ticket .foot { padding: 0 14px 14px; }
  .ticket .foot .btn { width: 100%; }

  /* Menu */
  .menu-table { width: 100%; border-collapse: collapse; }
  .menu-table th { text-align: left; color: var(--muted); font-size: 13px; font-weight: 700; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--soft); }
  .menu-table td { padding: 11px 16px; border-bottom: 1px solid var(--line); }
  .menu-table tr:last-child td { border-bottom: 0; }
  .menu-table .nmcell { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .menu-table .muted { color: var(--muted); }
  .switch { width: 46px; height: 26px; border-radius: 99px; background: #CFC6BE; position: relative; transition: background .15s; vertical-align: middle; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; transition: left .15s; box-shadow: 0 1px 2px #0003; }
  .switch.on { background: var(--green); }
  .switch.on::after { left: 23px; }
  .sw-label { font-size: 13px; font-weight: 600; margin-left: 8px; }
  .chipbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip { padding: 7px 13px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); font-weight: 600; font-size: 13.5px; }
  .chip.on { background: var(--dark); color: #FFFFFF; border-color: var(--dark); }

  /* Reports */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .kpi { padding: 16px 18px; }
  .kpi span { color: var(--muted); font-size: 13.5px; font-weight: 600; }
  .kpi b { display: block; font-size: 28px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi small { color: var(--green); font-weight: 700; font-size: 12.5px; }
  .rep-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; margin-top: 14px; }
  .rep-card { padding: 16px 18px; }
  .rep-card h3 { margin: 0 0 12px; font-size: 15px; }
  .split { display: flex; height: 16px; border-radius: 99px; overflow: hidden; margin: 6px 0 14px; }
  .split-legend { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .split-legend div { font-size: 13px; color: var(--muted); }
  .split-legend b { display: block; color: var(--ink); font-size: 17px; font-variant-numeric: tabular-nums; }
  .split-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
  .top-item { display: grid; grid-template-columns: 1fr 44px; gap: 4px 10px; align-items: center; margin-bottom: 10px; font-size: 14px; font-weight: 600; }
  .top-item .bar { grid-column: 1 / -1; height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; }
  .top-item .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .top-item em { font-style: normal; text-align: right; color: var(--muted); }

  /* Modal / toast */
  .overlay { position: fixed; inset: 0; background: #2A1E1766; display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .overlay.show { display: flex; }
  .modal { background: var(--panel); border-radius: 16px; padding: 20px; width: min(420px, 100%); max-height: 92vh; overflow: auto; }
  .modal h2 { margin: 0 0 4px; font-size: 19px; }
  .modal p { margin: 0 0 14px; color: var(--muted); }
  .variant-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .variant-opts button { padding: 16px; border: 2px solid var(--line); border-radius: 12px; font-weight: 700; font-size: 16px; }
  .variant-opts button:hover { border-color: var(--accent); }
  .variant-opts b { display: block; color: var(--accent-dark); margin-top: 4px; }
  .receipt { font-family: "Consolas", "Courier New", monospace; font-size: 13.5px; background: #FFFFFF; border: 1px dashed #BDB3AA; padding: 16px; line-height: 1.45; color: #1E1E1E; }
  .receipt .c { text-align: center; }
  .receipt .rule { border-top: 1px dashed #8E8E8E; margin: 8px 0; }
  .receipt table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .receipt td { padding: 1px 0; vertical-align: top; }
  .receipt td.r { text-align: right; }
  .receipt .big { font-size: 16px; font-weight: 700; }
  .modal-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .modal-actions .btn { flex: 1; }
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); background: var(--dark); color: #FFFFFF; padding: 12px 18px; border-radius: 12px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .2s; z-index: 60; max-width: calc(100% - 32px); box-shadow: 0 6px 20px #0003; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .bottomnav { display: none; }

  /* QR codes page */
  .qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .qr-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .qr-card .qr { width: 150px; height: 150px; }
  .qr-card .qr svg { width: 100%; height: 100%; display: block; }
  .qr-card b { font-size: 18px; }
  .qr-card small { color: var(--muted); }
  .note { background: var(--blue-soft); color: #1F3F5E; border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.5; margin: 0 0 14px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 99px; text-transform: uppercase; letter-spacing: .03em; }
  .tag.paid { background: var(--green-soft); color: var(--green); }
  .tag.qr { background: var(--blue-soft); color: var(--blue); }
  .tk-note { padding: 8px 14px 0; font-size: 13px; font-weight: 700; color: var(--blue); }

  /* Customer (QR) phone page */
  .cust-wrap { display: none; }
  body.customer .app, body.customer .bottomnav { display: none; }
  body.customer .cust-wrap { display: flex; justify-content: center; background: var(--bg); }
  .phone { width: 100%; max-width: 430px; height: 100vh; height: 100dvh; background: var(--panel); display: flex; flex-direction: column; position: relative; overflow: hidden; }
  @media (min-width: 700px) {
    body.customer .cust-wrap { padding: 20px 0; min-height: 100vh; }
    .phone { height: calc(100vh - 40px); border-radius: 30px; border: 9px solid var(--dark); box-shadow: 0 12px 40px #2A1E1733; }
  }
  .c-head { background: var(--dark); color: #FFFFFF; padding: 16px 18px 14px; }
  .c-head .r { font-size: 19px; font-weight: 800; }
  .c-head .t { margin-top: 6px; font-size: 13.5px; color: #E9DFD6; display: flex; gap: 8px; align-items: center; }
  .c-head .t b { background: var(--accent); color: var(--dark); padding: 2px 9px; border-radius: 99px; }
  .c-body { flex: 1; overflow: auto; padding: 12px 16px 96px; }
  .c-cats { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 10px; margin-top: -12px; position: sticky; top: -12px; background: var(--panel); z-index: 2; }
  .c-cats .chip { white-space: nowrap; }
  .c-item { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .c-item .info { flex: 1; min-width: 0; }
  .c-item .nm { font-weight: 700; display: flex; gap: 8px; align-items: center; }
  .c-item .pr { font-weight: 700; margin-top: 4px; color: var(--muted); font-size: 14px; }
  .c-item .ds { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .add-btn { border: 1.5px solid var(--accent); color: var(--accent-dark); font-weight: 800; border-radius: 10px; padding: 7px 18px; background: #FFF8F0; }
  .c-qty { display: flex; align-items: center; background: var(--accent); color: #FFFFFF; border-radius: 10px; overflow: hidden; flex: none; }
  .c-qty button { width: 34px; height: 34px; color: #FFFFFF; font-weight: 800; font-size: 18px; }
  .c-qty span { min-width: 22px; text-align: center; font-weight: 800; }
  .c-bar { position: absolute; left: 12px; right: 12px; bottom: 14px; background: var(--accent); color: #FFFFFF; border-radius: 14px; padding: 15px 16px; display: flex; justify-content: space-between; font-weight: 800; font-size: 16px; box-shadow: 0 8px 20px #2A1E1740; }
  .c-sec { font-weight: 800; margin: 18px 0 6px; font-size: 16px; }
  .c-row { display: flex; justify-content: space-between; padding: 4px 0; color: var(--muted); font-size: 14px; gap: 10px; }
  .c-row.total { color: var(--ink); font-weight: 800; font-size: 18px; border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 10px; }
  .pay-opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 2px solid var(--line); border-radius: 12px; padding: 13px 14px; margin-bottom: 10px; }
  .pay-opt.on { border-color: var(--accent); background: #FFF8F0; }
  .pay-opt .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
  .pay-opt.on .dot { border: 5px solid var(--accent); }
  .pay-opt b { display: block; }
  .pay-opt small { color: var(--muted); }
  .c-note { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-family: inherit; font-size: 14px; resize: none; }
  .c-center { text-align: center; padding: 26px 6px; }

var qrcode = function() {

  // qrcode

  /**

   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'

  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD1 = 0x11;

    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {

          }

      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);

      mapData(_dataCache, maskPattern);

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          } else {
            _modules[row + r][col + c] = false;
          }

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              } else {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

        } else if (i < 8) {

        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }

      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {

        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }

              var mask = maskFunc(row, col - c);

              _modules[row][col - c] = dark;

          if (row < 0 || _moduleCount <= row) {

      var maxEcCount = 0;

      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;

          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);

        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {

      return _modules[row][col];

    _this.getModuleCount = function() {

            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );

      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';

      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';

      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +

      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {

      qrSvg += '</svg>';

      return qrSvg;
    };

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);

      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;

        '█ ': '▀',

        '  ': ' '

        if (c < 128) {

const rs = (n) => "₹" + Math.round(n).toLocaleString("en-IN");
const rs2 = (n) => "₹" + n.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const ago = (t) => { const m = Math.max(0, Math.round((Date.now() - t) / 60000)); return m < 1 ? "just now" : m + " min ago"; };
const lineName = (l) => l.name + (l.variant ? ` (${l.variant})` : "");
function totals(o) {
  const sub = o.items.reduce((s, l) => s + l.price * l.qty, 0);
  const disc = Math.round((sub * o.discount) / 100);
  const taxable = sub - disc;
  const cgst = Math.round(taxable * 2.5) / 100;
  const sgst = cgst;
  const raw = taxable + cgst + sgst;
  const total = Math.round(raw);
  return { sub, disc, taxable, cgst, sgst, round: total - raw, total };
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 3200);
}
function showModal(html) { document.getElementById("modal").innerHTML = html; document.getElementById("overlay").classList.add("show"); }
function closeModal() { document.getElementById("overlay").classList.remove("show"); }

function go(h) { if (location.hash.slice(1) === h) route(); else location.hash = h; }
function route() {

      <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button></div>`);

function addLine(id, variant) {
  const o = orders[posKey];
  const m = MENU.find((x) => x.id === id);
  const price = variant ? m.variants.find((v) => v[0] === variant)[1] : m.price;
  const l = o.items.find((x) => x.mid === id && x.variant === variant && !x.qr);
  if (l) l.qty++; else o.items.push({ mid: id, name: m.name, variant, price, qty: 1, sent: 0 });
  o.billed = false;
  render();
}
function changeQty(i, d) {
  const o = orders[posKey];
  const l = o.items[i];
  l.qty += d;
  if (l.qty < l.sent) l.sent = l.qty;
  if (l.qty <= 0) o.items.splice(i, 1);
  o.billed = false;
  render();
}
function toggleDiscount() { const o = orders[posKey]; o.discount = o.discount ? 0 : 10; render(); }
function sendKOT(silent) {
  const o = orders[posKey];
  const newItems = o.items.filter((l) => l.qty > l.sent).map((l) => [lineName(l), l.qty - l.sent]);
  if (!newItems.length) return null;
  o.items.forEach((l) => { l.sent = l.qty; });
  const no = kotNo++;
  tickets.push({ no, label: o.label, created: Date.now(), status: "new", items: newItems });
  if (!silent) { toast(`KOT #${no} sent to the kitchen ✓`); render(); }
  return no;
}

        ${o.paid ? `<tr><td>Paid online</td><td class="r">-${o.paid.toFixed(2)}</td></tr><tr class="big"><td>BALANCE</td><td class="r">${rs(balanceDue(o, t))}</td></tr>` : ""}

      <button class="btn" onclick="closeModal()">Close</button>

function pay(method) {
  const o = orders[posKey];
  if (!o || !o.items.length) return;
  sendKOT(true);
  const t = totals(o);
  const due = balanceDue(o, t);
  recordSale(due, method === "none" ? null : method);
  sales.orders += 1;
  o.items.filter((l) => !(l.qr && l.paidOnline)).forEach((l) => { sales.items[l.name] = (sales.items[l.name] || 0) + l.qty; });
  delete orders[o.key];
  posKey = null;
  const how = { cash: "cash", upi: "UPI", card: "card" }[method];
  const done = o.type === "dine" ? o.label + " is free now." : o.label + " done.";
  toast(due > 0 ? `${rs(due)} received by ${how}. ${done}` : `Already paid online. ${done}`);
  go("tables");
}

function viewKitchen() {
  const cols = [
    { st: "new", title: "New orders", btn: "Start cooking" },
    { st: "preparing", title: "Cooking", btn: "Food ready" },
    { st: "ready", title: "Ready to serve", btn: "Served ✓" },
  ];
  return `<div class="kds">${cols.map((c) => {
    const list = tickets.filter((t) => t.status === c.st);
    return `<div class="kds-col"><h3>${c.title} <span class="cnt">${list.length}</span></h3><div class="kds-stack">

        <div class="ticket ${t.status}">
          <div class="ticket-head"><span>${t.label}</span><small>KOT #${t.no} · ${ago(t.created)}</small></div>
          ${t.src === "qr" ? `<div class="tk-note">📱 QR order · ${t.paid ? "Paid online" : "Pay at counter"}</div>` : ""}
          ${t.note ? `<div class="tk-note" style="color:var(--accent-dark)">Note: ${esc(t.note)}</div>` : ""}
          <ul>${t.items.map(([n, q]) => `<li><b>${q} ×</b>${n}</li>`).join("")}</ul>
          <div class="foot"><button class="btn ${c.st === "ready" ? "green" : "dark"}" onclick="advance(${t.no})">${c.btn}</button></div>
        </div>`).join("") || `<div class="empty card">Nothing here</div>`}
    </div></div>`;
  }).join("")}</div>`;
}
function advance(no) {
  const t = tickets.find((x) => x.no === no);
  if (t.status === "new") t.status = "preparing";
  else if (t.status === "preparing") { t.status = "ready"; toast(`${t.label}: food is ready. Waiter is notified.`); }
  else { tickets.splice(tickets.indexOf(t), 1); toast(`${t.label}: served.`); }
  render();
}

// ---------- Menu ----------
function viewMenu() {
  const list = MENU.filter((m) => menuCat === "All" || m.cat === menuCat);
  return `
  <div class="row" style="justify-content:space-between;margin-bottom:14px">
    <div class="chipbar" style="margin:0">${["All", ...CATS].map((c) => `<button class="chip ${menuCat === c ? "on" : ""}" onclick="menuCat='${c}';render()">${c.replace("&", "&amp;")}</button>`).join("")}</div>
    <button class="btn primary" onclick="toast('In the real software you can add new dishes, prices and photos here.')">+ Add dish</button>
  </div>
  <div class="card" style="overflow:hidden">
    <table class="menu-table">
      <tr><th>Dish</th><th class="hide-m">Category</th><th>Price</th><th>Available today</th></tr>
      ${list.map((m) => `
        <tr>
          <td><span class="nmcell"><span class="vmark ${m.veg ? "" : "nv"}"></span>${m.name}</span></td>
          <td class="hide-m muted">${m.cat}</td>
          <td>${m.variants ? m.variants.map(([v, p]) => `${v} ${rs(p)}`).join(" · ") : rs(m.price)}</td>
          <td><button class="switch ${m.available ? "on" : ""}" onclick="toggleAvail(${m.id})" aria-label="Available"></button><span class="sw-label" style="color:${m.available ? "var(--green)" : "var(--red)"}">${m.available ? "Yes" : "No"}</span></td>
        </tr>`).join("")}
    </table>
  </div>`;
}
function toggleAvail(id) {
  const m = MENU.find((x) => x.id === id);
  m.available = !m.available;
  toast(`${m.name} is now ${m.available ? "available" : "NOT available"}. Billing screen updated.`);
  render();
}

// ---------- Reports ----------
function viewReports() {
  const avg = sales.orders ? sales.total / sales.orders : 0;
  const running = Object.values(orders).reduce((s, o) => s + totals(o).total, 0);
  const pct = (v) => (sales.total ? (v / sales.total) * 100 : 0);
  const hours = [];
  for (let h = 11; h <= 23; h++) hours.push(h);
  const maxH = Math.max(1000, ...hours.map((h) => sales.hourly[h] || 0));
  const W = 560, H = 320, bw = W / hours.length;
  const bars = hours.map((h, i) => {
    const v = sales.hourly[h] || 0;
    const bh = (v / maxH) * (H - 30);
    const x = i * bw + 6, y = H - 22 - bh;
    const lbl = h === 12 ? "12p" : h > 12 ? h - 12 + "p" : h + "a";
    return `<rect x="${x}" y="${y}" width="${bw - 12}" height="${bh}" rx="4" fill="#D9822B"><title>${lbl}: ${rs(v)}</title></rect>
      <text x="${x + (bw - 12) / 2}" y="${H - 6}" text-anchor="middle" font-size="12" fill="#6B5E55">${lbl}</text>`;
  }).join("");
  const top = Object.entries(sales.items).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const topMax = top.length ? top[0][1] : 1;
  return `
  <div class="kpis">
    <div class="card kpi"><span>Today's sales</span><b>${rs(sales.total)}</b><small>▲ 12% vs last Sunday</small></div>
    <div class="card kpi"><span>Bills today</span><b>${sales.orders}</b></div>
    <div class="card kpi"><span>Average bill</span><b>${rs(avg)}</b></div>
    <div class="card kpi"><span>Running tables (not paid yet)</span><b>${rs(running)}</b></div>
  </div>
  <div class="rep-grid">
    <div class="card rep-card">
      <h3>Sales by hour</h3>
      <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Sales by hour">${bars}</svg>
    </div>
    <div class="card rep-card">
      <h3>How customers paid</h3>
      <div class="split">
        <i style="width:${pct(sales.cash)}%;background:#2E7D4F"></i>
        <i style="width:${pct(sales.upi)}%;background:#D9822B"></i>
        <i style="width:${pct(sales.card)}%;background:#2F5D8A"></i>
        <i style="width:${pct(sales.online)}%;background:#2A1E17"></i>
      </div>
      <div class="split-legend">
        <div><i style="background:#2E7D4F"></i>Cash<b>${rs(sales.cash)}</b></div>
        <div><i style="background:#D9822B"></i>UPI<b>${rs(sales.upi)}</b></div>
        <div><i style="background:#2F5D8A"></i>Card<b>${rs(sales.card)}</b></div>
        <div><i style="background:#2A1E17"></i>Online (QR)<b>${rs(sales.online)}</b></div>
      </div>
      <h3 style="margin-top:22px">Best-selling dishes today</h3>
      ${top.map(([n, q]) => `<div class="top-item"><span>${n}</span><em>${q}</em><div class="bar"><i style="width:${(q / topMax) * 100}%"></i></div></div>`).join("")}
    </div>
  </div>
  <p style="color:var(--muted);font-size:13px;margin-top:14px">QR orders today: ${sales.qrOrders} · Cancelled bills today: ${sales.cancelled} · The owner can also see these numbers on their phone.</p>`;
}

// ---------- Shared helpers ----------
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function balanceDue(o, t) { if (!o.paid) return t.total; const d = t.total - o.paid; return d <= 1 ? 0 : d; }
function recordSale(amount, method) {
  if (amount <= 0) return;
  sales.total += amount;
  if (method) sales[method] += amount;
  const h = Math.min(23, Math.max(11, new Date().getHours()));
  sales.hourly[h] = (sales.hourly[h] || 0) + amount;
}

// ---------- QR codes (staff side) ----------
function tableUrl(no) { return location.href.split("#")[0] + "#order/T" + no; }
function qrSvg(text) { const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 2 }); }
function viewQR() {
  const online = location.protocol.startsWith("http");
  return `
  <div class="note">${online
    ? "<b>Try it:</b> scan any code below with your phone camera. The menu opens on your phone and you can order and pay (demo payment, no real money)."
    : "<b>How it works:</b> each table gets its own QR code sticker. The customer scans it, sees the menu, orders and pays online, and the order goes straight to the kitchen.<br>These codes will open on phones once this demo is put online (for example on Netlify). For now, click <b>Try as customer</b>."}</div>
  <div class="row" style="justify-content:space-between;margin-bottom:14px">
    <span style="color:var(--muted)">In the real software each code carries a secret key, so nobody can order from outside the restaurant.</span>
    <button class="btn primary" onclick="printQR()">Print all QR codes</button>
  </div>
  <div class="qr-grid">
    ${TABLES.map((t) => `
      <div class="qr-card">
        <b>Table ${t.no}</b>
        <div class="qr">${qrSvg(tableUrl(t.no))}</div>
        <small>Scan to see the menu, order &amp; pay</small>
        <button class="btn" onclick="go('order/T${t.no}')">Try as customer</button>
      </div>`).join("")}
  </div>
  <div class="section-title" style="margin-top:26px">Menu for people at home</div>
  <p style="color:var(--muted);margin:4px 0 12px">View-only menu with no ordering. Put this link or QR code on Google Maps, Instagram, WhatsApp, visiting cards and posters.</p>
  <div class="qr-grid">
    <div class="qr-card">
      <b>Our Menu</b>
      <div class="qr">${qrSvg(location.href.split("#")[0] + "#menu-online")}</div>
      <small>Scan to see our menu</small>
      <button class="btn" onclick="go('menu-online')">Open home menu</button>
    </div>
  </div>`;
}
function printQR() { document.body.classList.add("print-qr"); window.print(); document.body.classList.remove("print-qr"); }

// ---------- Customer phone page (after scanning the table QR) ----------
function enterCustomer(no) {
  if (!cust || cust.table !== no) cust = { table: no, cart: [], step: "menu", cat: "All", vegOnly: false, pay: "online", app: "GPay", note: "", last: null, processing: false };
  document.body.classList.add("customer");
  closeModal();
  renderCustomer();
}
function renderCustomer() {
  const el = document.getElementById("phone");
  const prev = el.querySelector(".c-body");
  const keep = prev && cust.shown === cust.step ? prev.scrollTop : 0;
  const head = `<div class="c-head">
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="r">${esc(RESTAURANT.name)}</span><button class="staff-link" onclick="go('qr')">Staff view (demo)</button></div>
    <div class="t">${cust.table ? `<b>Table ${cust.table}</b><span>Order from your phone &amp; pay online</span>` : `<b>Menu</b><span>${esc(RESTAURANT.address)}</span>`}</div></div>`;
  el.innerHTML = head + { menu: custMenu, cart: custCart, pay: custPay, done: custDone }[cust.step]();
  const body = el.querySelector(".c-body");
  if (body) body.scrollTop = keep;
  cust.shown = cust.step;
}
const cartCount = () => cust.cart.reduce((s, c) => s + c.qty, 0);
const cartTotals = () => totals({ items: cust.cart, discount: 0 });
function custStep(step) { cust.step = step; renderCustomer(); }
function custAdd(id, variant) {
  const m = MENU.find((x) => x.id === id);
  const price = variant ? m.variants.find((v) => v[0] === variant)[1] : m.price;
  const c = cust.cart.find((x) => x.mid === id && x.variant === variant);
  if (c) c.qty++; else cust.cart.push({ mid: id, name: m.name, variant, price, qty: 1 });
  renderCustomer();
}
function custTap(id) {
  const m = MENU.find((x) => x.id === id);
  if (!m.available) return;
  if (!m.variants) { custAdd(id, null); return; }
  showModal(`<h2>${m.name}</h2><p>Choose the plate size</p>
    <div class="variant-opts">${m.variants.map(([v, p]) => `<button onclick="custAdd(${m.id},'${v}');closeModal()">${v}<b>${rs(p)}</b></button>`).join("")}</div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button></div>`);
}
function custQty(i, d) {
  const c = cust.cart[i];
  c.qty += d;
  if (c.qty <= 0) cust.cart.splice(i, 1);
  if (!cust.cart.length) cust.step = "menu";
  renderCustomer();
}
function custQtyItem(id, d) {
  const i = cust.cart.findIndex((c) => c.mid === id && !c.variant);
  if (i >= 0) custQty(i, d); else if (d > 0) custAdd(id, null);
}
function callWaiter() {
  toast(`A waiter is coming to Table ${cust.table}.`);
  staffNotice = `Table ${cust.table} is calling a waiter.`;
}
function custMenu() {
  const list = MENU.filter((m) => (cust.cat === "All" || m.cat === cust.cat) && (!cust.vegOnly || m.veg));
  const groups = CATS.map((c) => [c, list.filter((m) => m.cat === c)]).filter(([, l]) => l.length);
  const inCart = (m) => cust.cart.filter((c) => c.mid === m.id).reduce((s, c) => s + c.qty, 0);
  const n = cartCount();
  return `<div class="c-body">
    <div class="c-cats">
      <button class="chip ${cust.vegOnly ? "on" : ""}" onclick="cust.vegOnly=!cust.vegOnly;renderCustomer()">Veg only</button>
      ${["All", ...CATS].map((c) => `<button class="chip ${cust.cat === c ? "on" : ""}" onclick="cust.cat='${c}';renderCustomer()">${c.replace("&", "&amp;")}</button>`).join("")}
    </div>
    ${cust.table ? `<div class="row" style="justify-content:space-between;margin-top:4px">
      <span style="color:var(--muted);font-size:13.5px">Tap ADD, then view your cart</span>
      <button class="btn" style="padding:7px 12px;font-size:13.5px" onclick="callWaiter()">🔔 Call waiter</button>
    </div>` : `<div class="row" style="margin-top:4px">
      <button class="btn primary" style="flex:1" onclick="toast('In the real software this calls the restaurant: ${RESTAURANT.phone}')">📞 Call us</button>
      <button class="btn" style="flex:1" onclick="toast('In the real software this opens Google Maps directions.')">📍 Directions</button>
    </div>
    <p style="color:var(--muted);font-size:13px;margin:10px 0 0">Today's menu. Prices are before GST.</p>`}
    ${groups.map(([c, items]) => `<div class="c-sec">${c.replace("&", "&amp;")}</div>` + items.map((m) => {
      const q = inCart(m);
      let ctl;
      if (!m.available) ctl = `<span style="color:var(--red);font-size:13px;font-weight:700">Not available</span>`;
      else if (!cust.table) ctl = "";
      else if (m.variants) ctl = `<div style="text-align:center"><button class="add-btn" onclick="custTap(${m.id})">ADD</button>${q ? `<div style="font-size:12px;color:var(--muted);margin-top:4px">${q} in cart</div>` : ""}</div>`;
      else if (q) ctl = `<div class="c-qty"><button onclick="custQtyItem(${m.id},-1)">−</button><span>${q}</span><button onclick="custQtyItem(${m.id},1)">+</button></div>`;
      else ctl = `<button class="add-btn" onclick="custTap(${m.id})">ADD</button>`;
      return `<div class="c-item" style="${m.available ? "" : "opacity:.5"}">
        <div class="info"><div class="nm"><span class="vmark ${m.veg ? "" : "nv"}"></span>${m.name}</div>
        <div class="pr">${m.variants ? m.variants.map(([v, p]) => `${v} ${rs(p)}`).join(" · ") : rs(m.price)}</div></div>${ctl}</div>`;
    }).join("")).join("")}
  </div>
  ${n && cust.table ? `<button class="c-bar" onclick="custStep('cart')"><span>${n} item${n === 1 ? "" : "s"} · ${rs(cartTotals().sub)}</span><span>View cart →</span></button>` : ""}`;
}
function custCart() {
  const t = cartTotals();
  const online = cust.pay === "online";
  return `<div class="c-body">
    <button class="btn" style="padding:7px 12px" onclick="custStep('menu')">← Back to menu</button>
    <div class="c-sec">Your order</div>
    ${cust.cart.map((c, i) => `<div class="c-item">
      <div class="info"><div class="nm">${lineName(c)}</div><div class="ds">${rs(c.price)} each</div></div>
      <div class="c-qty"><button onclick="custQty(${i},-1)">−</button><span>${c.qty}</span><button onclick="custQty(${i},1)">+</button></div>
      <div style="width:62px;text-align:right;font-weight:800">${rs(c.price * c.qty)}</div></div>`).join("")}
    <div class="c-sec">Any special request?</div>
    <textarea class="c-note" rows="2" placeholder="e.g. less spicy, no onion" oninput="cust.note=this.value">${esc(cust.note)}</textarea>
    <div class="c-sec">Bill</div>
    <div class="c-row"><span>Items total</span><span>${rs2(t.sub)}</span></div>
    <div class="c-row"><span>CGST 2.5%</span><span>${rs2(t.cgst)}</span></div>
    <div class="c-row"><span>SGST 2.5%</span><span>${rs2(t.sgst)}</span></div>
    <div class="c-row total"><span>Total</span><span>${rs(t.total)}</span></div>
    <div class="c-sec">How would you like to pay?</div>
    <button class="pay-opt ${online ? "on" : ""}" onclick="cust.pay='online';renderCustomer()"><span class="dot"></span><span><b>Pay now online</b><small>UPI (GPay, PhonePe, Paytm) or card</small></span></button>
    <button class="pay-opt ${online ? "" : "on"}" onclick="cust.pay='counter';renderCustomer()"><span class="dot"></span><span><b>Pay later at the counter</b><small>Cash, UPI or card after eating</small></span></button>
  </div>
  <button class="c-bar" onclick="${online ? "custStep('pay')" : "placeCustomerOrder(false)"}"><span>${online ? "Pay " + rs(t.total) : "Place order"}</span><span>→</span></button>`;
}
function custPay() {
  const t = cartTotals();
  const via = cust.app === "Card" ? "by card" : "with " + cust.app;
  if (cust.processing) return `<div class="c-body"><div class="c-center"><div class="spinner"></div><b>Waiting for payment…</b><p style="color:var(--muted)">Approve ${rs(t.total)} ${via}.</p></div></div>`;
  return `<div class="c-body">
    <button class="btn" style="padding:7px 12px" onclick="custStep('cart')">← Back</button>
    <div class="c-center" style="padding:18px 0 6px">
      <div style="color:var(--muted)">Amount to pay</div>
      <div style="font-size:36px;font-weight:800">${rs(t.total)}</div>
      <div style="color:var(--muted);font-size:13px">${esc(RESTAURANT.name)} · Table ${cust.table}</div>
    </div>
    <div class="c-sec">Pay using</div>
    <div class="upi-apps">${["GPay", "PhonePe", "Paytm", "BHIM", "Card"].map((a) => `<button class="${cust.app === a ? "on" : ""}" onclick="cust.app='${a}';renderCustomer()">${a === "Card" ? "💳 Card" : a}</button>`).join("")}</div>
    <p class="note" style="margin-top:14px">Demo payment page: no real money is taken. The real software uses a payment company (like Razorpay or PhonePe), and the money goes straight to the restaurant's bank account.</p>
  </div>
  <button class="c-bar" style="background:var(--green)" onclick="custDoPay()"><span>Pay ${rs(t.total)} ${via}</span><span>🔒</span></button>`;
}
function custDoPay() {
  cust.processing = true;
  renderCustomer();
  setTimeout(() => { cust.processing = false; placeCustomerOrder(true); }, 1800);
}
function placeCustomerOrder(paid) {
  if (!cust.cart.length) return;
  const key = "T" + cust.table;
  if (!orders[key]) orders[key] = { key, label: "Table " + cust.table, type: "dine", started: Date.now(), items: [], discount: 0, billed: false, billNo: null, paid: 0, customer: { name: "", phone: "", address: "" } };
  const o = orders[key];
  const t = cartTotals();
  const n = cartCount();
  cust.cart.forEach((c) => o.items.push({ mid: c.mid, name: c.name, variant: c.variant, price: c.price, qty: c.qty, sent: c.qty, qr: true, paidOnline: paid }));
  o.billed = false;
  const no = kotNo++;
  tickets.push({ no, label: o.label, created: Date.now(), status: "new", src: "qr", paid, note: cust.note.trim(), items: cust.cart.map((c) => [lineName(c), c.qty]) });
  sales.qrOrders += 1;
  if (paid) {
    o.paid = (o.paid || 0) + t.total;
    recordSale(t.total, "online");
    cust.cart.forEach((c) => { sales.items[c.name] = (sales.items[c.name] || 0) + c.qty; });
  }
  staffNotice = `New QR order from ${o.label}: ${n} item${n === 1 ? "" : "s"}, ${paid ? "paid " + rs(t.total) + " online" : "will pay at the counter"}. Sent to kitchen (KOT #${no}).`;
  cust.last = { kot: no, amount: t.total, paid, app: cust.app, items: cust.cart.slice() };
  cust.cart = [];
  cust.note = "";
  cust.step = "done";
  renderCustomer();
}
function custDone() {
  const L = cust.last;
  const tk = tickets.find((x) => x.no === L.kot);
  const stage = tk ? { new: 0, preparing: 1, ready: 2 }[tk.status] : 3;
  return `<div class="c-body"><div class="c-center">
    <div class="big-check">✓</div>
    <div style="font-size:22px;font-weight:800">Order placed!</div>
    <p style="color:var(--muted);margin:6px 0 0">${L.paid ? `Paid ${rs(L.amount)} ${L.app === "Card" ? "by card" : "with " + L.app}` : `Please pay ${rs(L.amount)} at the counter`}<br>Order no. ${L.kot}</p>
    <div class="steps">${["Received", "Cooking", "Ready", "Served"].map((s, i) => `<div class="${i <= stage ? "on" : ""}"><i></i>${s}</div>`).join("")}</div>
    <div class="card" style="text-align:left;padding:10px 14px;margin-top:14px">${L.items.map((c) => `<div class="c-row" style="color:var(--ink)"><span>${c.qty} × ${lineName(c)}</span><span>${rs(c.price * c.qty)}</span></div>`).join("")}</div>
    <div class="row" style="justify-content:center;margin-top:18px">
      <button class="btn primary" onclick="custStep('menu')">+ Order more</button>
      <button class="btn" onclick="callWaiter()">🔔 Call waiter</button>
    </div>
    ${L.paid ? `<p style="color:var(--muted);font-size:13px;margin-top:14px">Your bill has been sent to your phone.</p>` : ""}
  </div></div>`;
}

// ---------- Start ----------
document.getElementById("brandName").textContent = RESTAURANT.name;
document.getElementById("brandLogo").textContent = RESTAURANT.name.charAt(0);
function tick() {
  document.getElementById("clock").textContent = new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });
}
tick();
setInterval(() => {
  tick();
  if (document.body.classList.contains("customer")) { if (cust && cust.step === "done") renderCustomer(); }
  else if (view === "kitchen" || view === "tables") render();
}, 30000);
route();
</script>
</body>
</html>
